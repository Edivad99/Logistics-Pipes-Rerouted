modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license     = "MMPL-1.0.1"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "Logistic Pipes 2"
    description = '''
        Logistic Pipes 2 is a NeoForge 1.20.1 revival of the classic Logistics Pipes:
        request-based item routing, automated crafting, and modular chassis pipes,
        brought back to modern Minecraft.

        Originally by Krapht; 1.12.2 codebase by the RS485 LP team. This port is
        maintained by NoZeroG and Edivad99 and distributed under the MMPL-1.0.1.
    '''
    authors = "NoZeroG and Edivad99 (NeoForge port), RS485 & LP Team (original 1.12.2), Krapht (original concept)"
    displayURL = "https://github.com/VoiceLessQ/Logistic-Pipes-2"
    issueTrackerURL = "https://github.com/VoiceLessQ/Logistic-Pipes-2/issues"

[[dependencies.logisticspipes]]
    type = "required"
    modId = "neoforge"
    ordering = "AFTER"
    side = "BOTH"
    versionRange = "${neo_version_range}"
[[dependencies.logisticspipes]]
    type = "required"
    modId = "minecraft"
    ordering = "NONE"
    side = "BOTH"
    versionRange = "${minecraft_version_range}"

# JEI — optional integration. Not listed as a dependency right now because JEI
# cannot load on NeoForge 1.20.1 due to an SRG-name remap gap (see MIGRATION.md).
# Re-add this block when JEI runtime support is verified:
#
