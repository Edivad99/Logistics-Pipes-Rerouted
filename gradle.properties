# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# The Kotlin plugin would put its stdlib on every source set's implementation configuration; only
# the test source set has Kotlin in it, and it asks for the stdlib itself.
kotlin.stdlib.default.dependency=false

kotlin_version=2.4.0
kotlinx_coroutines=1.11.0

