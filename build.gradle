plugins {
    id 'java'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'org.jetbrains.kotlin.plugin.lombok'
    id 'io.freefair.lombok'
    id 'signing'
    id 'com.github.johnrengelman.shadow'
}

archivesBaseName = 'logisticspipes'
group = 'network.rs485'
version = '0.11.0'
ext.vendor = 'unknown'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

def ENV = System.getenv()

if (ENV.BUILD_NUMBER) {
    version = "$version.${ENV.BUILD_NUMBER}"
} else if (ENV.VERSION) {
    version = "$version.${ENV.VERSION}"
} else {
    version = "$version-SNAPSHOT"
}

if (ENV.JENKINS_URL) {
    ext.vendor = ENV.JENKINS_URL
} else if (ENV.JITPACK) {
    ext.vendor = 'JitPack.io'
    group = ENV.GROUP
}

ext.sharedManifest = manifest {
    attributes(
        'Specification-Title':      'LogisticsPipes',
        'Specification-Vendor':     'RS485',
        'Specification-Version':    '1',
        'Implementation-Vendor':    "$vendor",
        'Implementation-Title':     "${project.name}",
        'Implementation-Version':   "$version",
        'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"))
}

// ── Source sets ──────────────────────────────────────────────────────────────

sourceSets {
    api {
        java { srcDirs = ['src/api/java'] }
    }
    main {
        compileClasspath += api.output
        runtimeClasspath  += api.output
        java      { srcDirs += 'common' }
        resources { srcDirs += 'resources' }
    }
    test {
        compileClasspath += api.output
        runtimeClasspath  += api.output
    }
}

configurations {
    testCompileOnly.extendsFrom compileOnly
    ktlint
    // Libraries needed at game runtime in dev (runClient/runServer) that NeoGradle
    // doesn't automatically expose to the ModuleClassLoader from `implementation`.
    gameRuntime
}

// ── Kotlin ───────────────────────────────────────────────────────────────────

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        languageVersion = '1.9'
        jvmTarget = '17'
        freeCompilerArgs += '-Xjvm-default=all'
    }
}

kotlinLombok {
    lombokConfigurationFile file('lombok.config')
}

// ── NeoForge ─────────────────────────────────────────────────────────────────

// NeoForge 1.20.1 uses the old artifact ID: net.neoforged:forge:1.20.1-47.1.{patch}
// NeoGradle 7's UserDevDependencyManager intercepts this dependency declaration
// and replaces it with the full userdev runtime (deobf MC + NeoForge on classpath).
// Declared on both `implementation` (main) and `apiImplementation` (api sourceSet).
ext.neoforgeArtifact = "net.neoforged:forge:1.20.1-47.1.${(project.neoforge_version as String).split('\\.').last()}"

accessTransformers {
    file(rootProject.file('resources/META-INF/lp_at.cfg'))
}

runs {
    client {
        client()
        workingDirectory.set(project.file('run'))
        systemProperties.put('forge.logging.markers',       'SCAN,REGISTRIES,REGISTRYDUMP')
        systemProperties.put('forge.logging.console.level', 'debug')
        jvmArguments.add('-ea')
        modSource(sourceSets.api)
        modSource(sourceSets.main)
        classpath.from(configurations.gameRuntime)
    }
    server {
        server()
        workingDirectory.set(project.file('run-server'))
        systemProperties.put('forge.logging.markers',       'SCAN,REGISTRIES,REGISTRYDUMP')
        systemProperties.put('forge.logging.console.level', 'debug')
        programArguments.add('--nogui')
        jvmArguments.add('-ea')
        modSource(sourceSets.api)
        modSource(sourceSets.main)
        classpath.from(configurations.gameRuntime)
    }
}

// ── Dependencies ─────────────────────────────────────────────────────────────

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.removeco.de/' }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { url = 'https://maven.blamejared.com' }
}

dependencies {
    // NeoForge — UserDevDependencyManager intercepts this and wires MC to compile classpath
    implementation "${neoforgeArtifact}"
    // Also wire MC onto the `api` source set's compile classpath
    "apiImplementation"("${neoforgeArtifact}")

    // Kotlin for Forge 1.20.1 — provides kotlin stdlib + coroutines + serialization as a proper Forge mod module,
    // making them available on the ModLauncher module path at runtime (otherwise Kotlin classes fail to resolve
    // during event-bus reflection on Kotlin types).
    implementation "thedarkcolour:kotlinforforge:4.10.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"
    implementation "org.jetbrains:annotations:${kannotations_version}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${kcoroutines_version}"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kserialization_version}"
    implementation "com.charleskorn.kaml:kaml:${kaml_version}"
    gameRuntime "com.charleskorn.kaml:kaml:${kaml_version}"
    gameRuntime 'org.snakeyaml:snakeyaml-engine:2.3'

    // JEI — Just Enough Items (1.20.1 Forge)
    // runtimeOnly excluded: jei-1.20.1-forge-15.20.0.129 calls I18n.m_118938_ which is absent in
    // NeoForge 47.1.88 — crashes the entire mod loading phase. Compile-only keeps LP's JEI plugin
    // compilable; swap back to runtimeOnly once a compatible JEI build is available.
    compileOnly "mezz.jei:jei-1.20.1-forge-api:15.20.0.129"
    //runtimeOnly "mezz.jei:jei-1.20.1-forge:15.20.0.129"

    // Optional integrations (not yet ported to 1.20.1)
    // compileOnly "mcjty.theoneprobe:theoneprobe:..."

    ktlint("com.pinterest:ktlint:0.50.0") {
        attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, getObjects().named(Bundling, Bundling.EXTERNAL))
        }
    }

    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.3'
}

// ── JAR / Shadow ─────────────────────────────────────────────────────────────

jar {
    from sourceSets.api.output
    finalizedBy 'shadowJar'
    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest { from sharedManifest }
}

shadowJar {
    from sourceSets.api.output
    archiveClassifier.set('')

    dependencies {
        include(dependency("org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"))
        include(dependency("org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"))
        include(dependency("org.jetbrains:annotations:${kannotations_version}"))
        include(dependency("org.jetbrains.kotlinx:kotlinx-coroutines-core:${kcoroutines_version}"))
        include(dependency("org.jetbrains.kotlinx:kotlinx-serialization-json:${kserialization_version}"))
        include(dependency("com.charleskorn.kaml:kaml:${kaml_version}"))
        include(dependency('org.snakeyaml:snakeyaml-engine:2.3'))
    }

    relocate 'kotlin',               'logisticspipes.kotlin'
    relocate 'kotlinx',              'logisticspipes.kotlinx'
    relocate 'org.intellij',         'logisticspipes.intellij'
    relocate 'org.jetbrains',        'logisticspipes.jetbrains'
    relocate 'org.snakeyaml',        'logisticspipes.snakeyaml'
    relocate 'com.charleskorn.kaml', 'logisticspipes.kaml'

    exclude 'META-INF/versions/9/*'
    exclude 'DebugProbesKt.bin'

    manifest { inheritFrom sharedManifest }
}

// ── Additional artifacts ──────────────────────────────────────────────────────

task sourceJar(type: Jar) {
    from sourceSets.api.allSource
    from sourceSets.main.allSource
    archiveClassifier.set('sources')
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    from sourceSets.api.output
    archiveClassifier.set('deobf')
    duplicatesStrategy = DuplicatesStrategy.WARN
    manifest { from sharedManifest }
}

task apiJar(type: Jar, dependsOn: apiClasses) {
    from sourceSets.api.output
    from sourceSets.api.allSource
    archiveClassifier.set('api')
    duplicatesStrategy = DuplicatesStrategy.WARN
}

artifacts {
    archives apiJar
    archives shadowJar
    archives deobfJar
    archives sourceJar
}

// ── Tests ─────────────────────────────────────────────────────────────────────

tasks.withType(Test) {
    useJUnitPlatform()
    testLogging { events('passed', 'skipped', 'failed') }
}

// ── Resources ─────────────────────────────────────────────────────────────────

processResources {
    inputs.property 'version', project.version
    duplicatesStrategy = DuplicatesStrategy.FAIL
    // mods.toml version substitution
    filesMatching('META-INF/mods.toml') {
        expand version: project.version, mcversion: mcversion
    }
}

// ── ktlint ────────────────────────────────────────────────────────────────────

task ktlint(type: JavaExec, group: 'verification') {
    description = 'Check Kotlin code style.'
    classpath = configurations.ktlint
    mainClass.set('com.pinterest.ktlint.Main')
    args '**/*.kt'
}
// check.dependsOn ktlint

// ── Signing ───────────────────────────────────────────────────────────────────

task enableSigningTasks {
    doFirst {
        tasks.withType(Sign) { enabled = true }
    }
}

signing {
    useGpgCmd()
    sign apiJar
    sign shadowJar
    sign deobfJar
    sign sourceJar
}

task sign {
    dependsOn enableSigningTasks
    dependsOn(tasks.withType(Sign))
}

tasks.withType(Sign) {
    enabled = false
    mustRunAfter enableSigningTasks
    ext.useJarsigner = (name.toLowerCase().endsWith('jar') && name != 'signSourceJar')
}

gradle.taskGraph.whenReady { taskGraph ->
    taskGraph.allTasks.each { task ->
        if (task instanceof Sign && task.useJarsigner) {
            task.doFirst {
                task.filesToSign.each { File file ->
                    task.ant.signjar(
                        jar:         file,
                        alias:       '1',
                        storetype:   findProperty('LogisticsPipes.storetype'),
                        keystore:    findProperty('LogisticsPipes.keystore'),
                        storepass:   findProperty('LogisticsPipes.storepass'),
                        verbose:     'true',
                        preservelastmodified: 'true')
                }
            }
        }
    }
}

// ── Misc ─────────────────────────────────────────────────────────────────────

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask) {
    preserveFileTimestamps = false
    reproducibleFileOrder  = true
}

tasks.named('wrapper') {
    gradleVersion    = '8.1.1'
    distributionType = Wrapper.DistributionType.ALL
}

clean {
    setDelete(project.fileTree("$buildDir") {
        exclude 'fg_cache'
    })
}

publishing {
    publications {
        mavenJava(MavenPublication) { artifact jar }
    }
    repositories {
        maven { url "file://${project.projectDir}/mcmodsrepo" }
    }
}
